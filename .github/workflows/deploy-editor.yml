name: Publish translation editor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install rendering dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Check source and translation pairs
        run: |
          python3 -B tools/check_public_tree.py --repo .
          python3 -B tools/sync_csv.py --from json --check
          python3 -B -m unittest discover -s tests -v
      - name: Verify browser code
        run: node --test tests/browser/*.test.mjs
      - name: Build static editor
        run: python3 -B tools/build_web.py --out "${RUNNER_TEMP}/gintama-site"
      - name: Audit finished website
        run: python3 -B tools/check_public_tree.py --repo "${RUNNER_TEMP}/gintama-site" --profile site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: vars.PAGES_PUBLISHING_ENABLED == 'true' && github.event.repository.private == false
        with:
          path: ${{ runner.temp }}/gintama-site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PAGES_PUBLISHING_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
