name: Repository health
on:
  push:
    branches: [main, staging]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  health:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install rendering dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify source, website links and publication outputs without game files
        shell: bash
        run: python -B tools/verify.py --out "$RUNNER_TEMP/gintama-verification"
      - name: Ensure verification did not alter tracked files
        run: git diff --exit-code
      - name: Show verification summary
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "gintama-verification" / "verification.json"
          rows = ["## Offline verification", "Game files are not used in CI.", ""]
          if report.is_file():
              data = json.loads(report.read_text(encoding="utf-8"))
              rows += ["**Passed**" if data["passed"] else "**Failed**", "", "| Check | Result |", "| --- | --- |"]
              for step in data["steps"]:
                  result = "Passed" if step["exit_code"] == 0 else "Failed"
                  rows.append(f"| {step['name']} | {result} |")
          else:
              rows.append("No report was written. Check the earlier setup or verification step.")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(rows) + "\n")
      - name: Save verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/gintama-verification/verification.json
            ${{ runner.temp }}/gintama-verification/*.log
          if-no-files-found: ignore
          retention-days: 7
